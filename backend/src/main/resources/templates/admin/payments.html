<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Payments</title>

    <!-- Include common styles from fragment -->
    <th:block th:replace="~{admin/fragments/styles :: styles}" />
  </head>
  <body>
    <div class="d-flex">
      <!-- Include sidebar from fragment -->
      <div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>

      <main class="main-content">
        <div class="page-header mb-4">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <h1 class="page-title h3 m-0">Payments</h1>
              <small class="text-muted">Manage transactions and statuses</small>
            </div>
            <div class="d-flex gap-2">
              <button class="btn btn-outline-primary">
                <i class="fas fa-file-export me-2"></i>Export
              </button>
              <button class="btn btn-primary">
                <i class="fas fa-undo me-2"></i>Refund
              </button>
            </div>
          </div>
        </div>

        <div class="custom-table">
          <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead>
                <tr>
                  <th>Invoice</th>
                  <th>Method</th>
                  <th>Amount</th>
                  <th>Status</th>
                  <th>Created</th>
                  <th class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>#INV-000123</td>
                  <td>VNPay</td>
                  <td>$75.00</td>
                  <td><span class="badge bg-success">Completed</span></td>
                  <td>2025-08-24</td>
                  <td class="text-end">
                    <div class="btn-group">
                      <button class="btn btn-sm btn-outline-primary">
                        <i class="fas fa-eye"></i>
                      </button>
                      <button class="btn btn-sm btn-outline-warning">
                        <i class="fas fa-undo"></i>
                      </button>
                      <button class="btn btn-sm btn-outline-danger">
                        <i class="fas fa-times"></i>
                      </button>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
