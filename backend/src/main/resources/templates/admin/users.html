<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Users</title>

    <!-- Include common styles from fragment -->
    <th:block th:replace="~{admin/fragments/styles :: styles}" />
  </head>
  <body>
    <div class="d-flex">
      <!-- Include sidebar from fragment -->
      <div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>

      <main class="main-content">
        <div class="page-header mb-4">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <h1 class="page-title h3 m-0">Users</h1>
              <small class="text-muted">Manage system users and roles</small>
            </div>
            <div class="d-flex gap-2">
              <button class="btn btn-outline-primary">
                <i class="fas fa-upload me-2"></i>Import
              </button>
              <button class="btn btn-primary">
                <i class="fas fa-user-plus me-2"></i>New User
              </button>
            </div>
          </div>
        </div>

        <div class="custom-table">
          <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead>
                <tr>
                  <th>User</th>
                  <th>Email</th>
                  <th>Role</th>
                  <th>Status</th>
                  <th>Created</th>
                  <th class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>
                    <div class="d-flex align-items-center">
                      <div
                        class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center me-2"
                        style="width: 36px; height: 36px"
                      >
                        JD
                      </div>
                      John Doe
                    </div>
                  </td>
                  <td>john.doe@example.com</td>
                  <td>
                    <span class="badge bg-primary bg-opacity-10 text-primary"
                      >ADMIN</span
                    >
                  </td>
                  <td><span class="badge bg-success">Active</span></td>
                  <td>2025-08-01</td>
                  <td class="text-end">
                    <div class="btn-group">
                      <button class="btn btn-sm btn-outline-primary">
                        <i class="fas fa-eye"></i>
                      </button>
                      <button class="btn btn-sm btn-outline-secondary">
                        <i class="fas fa-edit"></i>
                      </button>
                      <button class="btn btn-sm btn-outline-danger">
                        <i class="fas fa-trash"></i>
                      </button>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
