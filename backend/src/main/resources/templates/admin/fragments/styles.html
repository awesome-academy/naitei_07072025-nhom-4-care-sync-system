<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Styles Fragment</title>
  </head>
  <body>
    <!-- Common Styles Fragment -->
    <th:block th:fragment="styles">
      <link href="/css/bootstrap.min.css" rel="stylesheet" />
      <link href="/css/all.min.css" rel="stylesheet" />
      <link href="/css/inter.css" rel="stylesheet" />

      <style>
        :root {
          --primary-color: #2563eb;
          --primary-light: #3b82f6;
          --primary-dark: #1d4ed8;
          --primary-gradient: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
          --secondary-gradient: linear-gradient(
            135deg,
            #3b82f6 0%,
            #2563eb 100%
          );
          --success-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
          --warning-gradient: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
          --info-gradient: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);
        }

        * {
          font-family: "Inter", sans-serif;
        }

        body {
          background: #f8fafc;
          overflow-x: hidden;
        }

        /* Sidebar Styles */
        .sidebar {
          background: var(--primary-gradient);
          width: 280px;
          min-width: 280px;
          min-height: 100vh;
          box-shadow: 4px 0 15px rgba(0, 0, 0, 0.1);
          position: fixed;
          top: 0;
          left: 0;
          z-index: 1000;
          transition: all 0.3s ease;
        }

        .sidebar .nav-link {
          color: rgba(255, 255, 255, 0.9);
          padding: 1rem 1.5rem;
          border-radius: 12px;
          margin: 0.25rem 1rem;
          transition: all 0.3s ease;
          position: relative;
          overflow: hidden;
        }

        .sidebar .nav-link::before {
          content: "";
          position: absolute;
          top: 0;
          left: -100%;
          width: 100%;
          height: 100%;
          background: rgba(255, 255, 255, 0.1);
          transition: left 0.3s ease;
        }

        .sidebar .nav-link:hover::before,
        .sidebar .nav-link.active::before {
          left: 0;
        }

        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
          color: white;
          background: rgba(255, 255, 255, 0.15);
          transform: translateX(5px);
          box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .sidebar .nav-link i {
          transition: transform 0.3s ease;
        }

        .sidebar .nav-link:hover i {
          transform: scale(1.1);
        }

        /* Main Content */
        .main-content {
          margin-left: 280px;
          width: calc(100% - 280px);
          padding: 2rem;
          min-height: 100vh;
        }

        /* Cards */
        .stat-card {
          background: white;
          border-radius: 16px;
          padding: 2rem;
          box-shadow: 0 4px 20px rgba(37, 99, 235, 0.08);
          transition: all 0.3s ease;
          border: 1px solid rgba(37, 99, 235, 0.1);
          position: relative;
          overflow: hidden;
        }

        .stat-card::before {
          content: "";
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          height: 4px;
          background: var(--primary-gradient);
        }

        .stat-card:hover {
          transform: translateY(-5px);
          box-shadow: 0 8px 25px rgba(37, 99, 235, 0.15);
          border-color: rgba(37, 99, 235, 0.2);
        }

        .stat-card.appointments::before {
          background: var(--primary-gradient);
        }
        .stat-card.doctors::before {
          background: var(--primary-gradient);
        }
        .stat-card.patients::before {
          background: var(--primary-gradient);
        }
        .stat-card.payments::before {
          background: var(--primary-gradient);
        }

        .stat-number {
          font-size: 2.5rem;
          font-weight: 700;
          background: var(--primary-gradient);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
        }

        .stat-icon {
          width: 60px;
          height: 60px;
          border-radius: 12px;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 1.5rem;
          color: white;
          background: var(--primary-gradient);
        }

        .stat-card.appointments .stat-icon {
          background: var(--primary-gradient);
        }
        .stat-card.doctors .stat-icon {
          background: var(--primary-gradient);
        }
        .stat-card.patients .stat-icon {
          background: var(--primary-gradient);
        }
        .stat-card.payments .stat-icon {
          background: var(--primary-gradient);
        }

        /* Header */
        .page-header {
          background: white;
          border-radius: 16px;
          padding: 2rem;
          margin-bottom: 2rem;
          box-shadow: 0 4px 20px rgba(37, 99, 235, 0.08);
          border: 1px solid rgba(37, 99, 235, 0.1);
        }

        .page-title {
          font-size: 2rem;
          font-weight: 700;
          background: var(--primary-gradient);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
          margin: 0;
        }

        /* Alert */
        .custom-alert {
          background: var(--primary-gradient);
          border: none;
          border-radius: 15px;
          color: white;
          padding: 1.5rem;
          box-shadow: 0 10px 30px rgba(37, 99, 235, 0.3);
        }

        /* Table */
        .custom-table {
          background: white;
          border-radius: 16px;
          overflow: hidden;
          box-shadow: 0 4px 20px rgba(37, 99, 235, 0.08);
          border: 1px solid rgba(37, 99, 235, 0.1);
        }

        .custom-table .table {
          margin: 0;
        }

        .custom-table th {
          background: var(--primary-gradient);
          color: white;
          border: none;
          padding: 1.25rem 1rem;
          font-weight: 600;
          font-size: 0.9rem;
        }

        .custom-table td {
          padding: 1.25rem 1rem;
          border: none;
          border-bottom: 1px solid rgba(37, 99, 235, 0.1);
        }

        .custom-table tbody tr:hover {
          background: rgba(37, 99, 235, 0.02);
          transition: all 0.3s ease;
        }

        /* Badge */
        .custom-badge {
          padding: 0.5rem 1rem;
          border-radius: 20px;
          font-weight: 500;
          font-size: 0.875rem;
        }

        /* Animations */
        @keyframes fadeInUp {
          from {
            opacity: 0;
            transform: translateY(30px);
          }
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }

        .fade-in-up {
          animation: fadeInUp 0.6s ease forwards;
        }

        .delay-1 {
          animation-delay: 0.1s;
        }
        .delay-2 {
          animation-delay: 0.2s;
        }
        .delay-3 {
          animation-delay: 0.3s;
        }
        .delay-4 {
          animation-delay: 0.4s;
        }

        /* Responsive */
        @media (max-width: 768px) {
          .sidebar {
            transform: translateX(-100%);
          }
          .main-content {
            margin-left: 0;
            width: 100%;
          }
          .sidebar.show {
            transform: translateX(0);
          }
        }

        /* Loading animation */
        .loading {
          display: inline-block;
          width: 20px;
          height: 20px;
          border: 3px solid rgba(255, 255, 255, 0.3);
          border-radius: 50%;
          border-top-color: #fff;
          animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
          to {
            transform: rotate(360deg);
          }
        }
      </style>
    </th:block>
  </body>
</html>
