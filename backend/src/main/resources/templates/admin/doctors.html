<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Doctors</title>

    <!-- Include common styles from fragment -->
    <th:block th:replace="~{admin/fragments/styles :: styles}" />
  </head>
  <body>
    <div class="d-flex">
      <!-- Include sidebar from fragment -->
      <div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>

      <main class="main-content">
        <div class="page-header mb-4">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <h1 class="page-title h3 m-0">Doctors</h1>
              <small class="text-muted">Manage doctors and specialties</small>
            </div>
            <div class="d-flex gap-2">
              <button class="btn btn-outline-primary">
                <i class="fas fa-filter me-2"></i>Filter
              </button>
              <button class="btn btn-primary">
                <i class="fas fa-user-md me-2"></i>New Doctor
              </button>
            </div>
          </div>
        </div>

        <div class="custom-table">
          <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Specialty</th>
                  <th>Phone</th>
                  <th>Status</th>
                  <th>Created</th>
                  <th class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>Dr. Sarah Wilson</td>
                  <td>
                    <span class="badge bg-primary bg-opacity-10 text-primary"
                      >Cardiology</span
                    >
                  </td>
                  <td>+1 202 555 0147</td>
                  <td><span class="badge bg-success">Active</span></td>
                  <td>2025-07-15</td>
                  <td class="text-end">
                    <div class="btn-group">
                      <button class="btn btn-sm btn-outline-primary">
                        <i class="fas fa-eye"></i>
                      </button>
                      <button class="btn btn-sm btn-outline-secondary">
                        <i class="fas fa-edit"></i>
                      </button>
                      <button class="btn btn-sm btn-outline-danger">
                        <i class="fas fa-trash"></i>
                      </button>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
