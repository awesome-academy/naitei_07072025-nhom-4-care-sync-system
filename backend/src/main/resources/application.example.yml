server:
  port: 8080

spring:
  application:
    name: backend
  datasource:
    url: jdbc:mysql://localhost:3306/health_booking_dev?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
    username: username
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    default-encoding: UTF-8
    properties:
      mail:
        debug: true
        smtp:
          auth: true
          starttls:
            enable: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: false
    validate-on-migrate: false

# Logging
logging:
  level:
    com.healthbooking: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# Swagger/OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

jwt:
  secret: ${JWT_SECRET:default_super_secret_key_for_development_environment}
  expiration: 86400000 # 24 hours
  refresh-expiration: 604800000 # 7 days

app:
  upload:
    dir: "uploads/"
    max-size: 10485760 # 10 MB
  swagger:
    title: Care Sync System API
    description: API documentation for the Care Sync System, providing endpoints for managing appointments, patients, and doctors.
    version: "1.0.0"
    contact-name: "Care Sync Support"
    contact-email: "support@caresync.com"
    contact-url: "https://your-support-page.com"
  timezone: Asia/Ho_Chi_Minh
  mail:
    fromEmail: ${MAIL_FROM:no-reply@example.com}
    fromName: ${MAIL_FROM_NAME:CareSync}
  base-url: ${APP_BASE_URL:http://localhost:8080}

# Payment providers configuration (examples)
payment:
  momo:
    partner-code: ${PAYMENT_MOMO_PARTNER_CODE:test-partner}
    access-key: ${PAYMENT_MOMO_ACCESS_KEY:test-access}
    secret-key: ${PAYMENT_MOMO_SECRET_KEY:test-secret}
    endpoint: ${PAYMENT_MOMO_ENDPOINT:https://test-payment.momo.vn}
    return-url: ${PAYMENT_MOMO_RETURN_URL:http://localhost:8080/payment/momo/return}
    notify-url: ${PAYMENT_MOMO_NOTIFY_URL:http://localhost:8080/payment/momo/notify}
  vnpay:
    tmn-code: ${PAYMENT_VNPAY_TMN_CODE:test-tmn}
    hash-secret: ${PAYMENT_VNPAY_HASH_SECRET:test-hash}
    url: ${PAYMENT_VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    return-url: ${PAYMENT_VNPAY_RETURN_URL:http://localhost:8080/payment/vnpay/return}

# Google Calendar Configuration
google:
  calendar:
    client-id: ${GOOGLE_CALENDAR_CLIENT_ID:your-google-client-id}
    client-secret: ${GOOGLE_CALENDAR_CLIENT_SECRET:your-google-client-secret}
